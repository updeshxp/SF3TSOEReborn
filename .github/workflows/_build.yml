name: Build sf3tsoereborn

on:
  workflow_call:
    inputs:
      publish_mode:
        description: "'artifact' for CI workflow-artifact, 'release' for GitHub release"
        required: true
        type: string
      artifact_name:
        description: "Artifact name prefix when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
      tag:
        description: "Release tag to embed in release artifact filenames"
        required: false
        type: string
        default: ""

env:
  ASSETS_REPO: ${{ vars.ASSETS_REPO }}
  CODEGEN_ASSETS: default.xex Gameicon.png
  ASSET_CACHE_KEY: codegen-assets-v2
  TU_ASSET_CACHE_KEY: tu-assets-v4

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-amd64
            runner: windows-latest

          - platform: linux-amd64
            runner: ubuntu-latest

          - platform: linux-arm64
            runner: ubuntu-24.04-arm

          - platform: mac-amd64
            runner: macos-26-intel

          - platform: mac-arm64
            runner: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libx11-xcb-dev libxss-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200


      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'mac-')
        run: brew install cmake ninja vulkan-loader molten-vk

      # Xcode 26's `metal` compiler lives in a separate, opt-in component;
      # HLSL-to-metallib shader compilation needs it installed explicitly.
      - name: Install Metal Toolchain (macOS)
        if: startsWith(matrix.platform, 'mac-')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install LLVM, CMake, Ninja (Windows)
        if: matrix.platform == 'win-amd64'
        run: choco install llvm cmake ninja -y

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ matrix.platform }}

      - name: Install Python build dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Cache codegen assets
        id: asset-cache
        uses: actions/cache@v5
        with:
          path: |
            assets/default.xex
            assets/Gameicon.png
          key: ${{ env.ASSET_CACHE_KEY }}

      - name: Fetch codegen assets
        if: steps.asset-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          mkdir -p assets
          for asset in ${{ env.CODEGEN_ASSETS }}; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ env.ASSETS_REPO }}/contents/${asset}" \
              > "assets/${asset}"
            size=$(wc -c < "assets/${asset}")
            echo "Fetched ${asset} (${size} bytes)"
            if [ "${asset}" = "default.xex" ]; then
              [ "$size" -ge 1048576 ] || { echo "Asset too small — fetch likely failed"; exit 1; }
            else
              [ "$size" -gt 0 ] || { echo "Asset is empty — fetch likely failed"; exit 1; }
            fi
          done

      - name: Cache TU packages
        id: tu-cache
        uses: actions/cache@v5
        with:
          path: tu_packages/
          key: ${{ env.TU_ASSET_CACHE_KEY }}

      - name: Fetch TU packages
        if: steps.tu-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          mkdir -p tu_packages

          files=$(gh api "repos/${{ env.ASSETS_REPO }}/contents/tu_packages/${f}" \
            --jq '.[] | select(.name | startswith("tu")) | .name')

          if [ -z "$files" ]; then
            echo "No TU packages found."
            exit 0
          fi

          for f in $files; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ env.ASSETS_REPO }}/contents/tu_packages/${f}" \
              > "tu_packages/${f}"
            echo "Fetched ${f} ($(wc -c < "tu_packages/${f}") bytes)"
          done
      
      - name: Detect TU packages
        id: tu
        shell: bash
        run: |
          if compgen -G "tu_packages/tu*" > /dev/null; then
            echo "has_tu=true" >> "$GITHUB_OUTPUT"
            echo "TU packages detected."
          else
            echo "has_tu=false" >> "$GITHUB_OUTPUT"
            echo "No TU packages detected. TU build will be skipped."
          fi

      # Download the SDK once per platform/arch and reuse it for both the
      # vanilla and TU builds below, instead of each variant fetching its
      # own copy — the SDK release API is rate-limited and doubling the
      # number of downloads was tripping it.
      - name: Download SDK
        shell: bash
        run: python scripts/download-sdk.py "sdk/${{ matrix.sdk_dir }}" --pinned

      - name: Build (vanilla)
        if: steps.tu.outputs.has_tu != 'true'
        shell: bash
        run: python scripts/build.py --release --sdk-dir sdk/${{ matrix.sdk_dir }}

      - name: Package (vanilla)
        if: steps.tu.outputs.has_tu != 'true' && !startsWith(matrix.platform, 'mac-')
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-${{ matrix.platform }}"
          else
            out="sf3tsoereborn-${{ inputs.tag }}-${{ matrix.platform }}"
          fi
          python scripts/build.py --package "${out}"

      # macOS gets a .app inside a .dmg rather than a tar.gz: the Vulkan
      # runtime has to be bundled (there is none on macOS by default), and a
      # disk image is what lets the user drag the app out to /Applications,
      # which is also what frees it from App Translocation. See
      # scripts/package-mac.py.
      - name: Package (macOS)
        if: steps.tu.outputs.has_tu != 'true' && startsWith(matrix.platform, 'mac-')
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-${{ matrix.platform }}"
            version="0.0.0"
          else
            out="sf3tsoereborn-${{ inputs.tag }}-${{ matrix.platform }}"
            version="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          fi
          python scripts/package-mac.py --name "${out}" --version "${version}"

      - name: Upload CI artifact (vanilla)
        if: steps.tu.outputs.has_tu != 'true' && inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.platform }}
          path: pkg/
          if-no-files-found: error

      - name: Upload release artifact (vanilla)
        if: steps.tu.outputs.has_tu != 'true' && inputs.publish_mode == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: release-vanilla-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: Build (tu)
        if: steps.tu.outputs.has_tu == 'true'
        shell: bash
        run: python scripts/build.py --release --sdk-dir sdk/${{ matrix.sdk_dir }} --tu tu_packages/

      - name: Package (tu)
        if: steps.tu.outputs.has_tu == 'true' && !startsWith(matrix.platform, 'mac-')
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-tu-${{ matrix.platform }}"
          else
            out="sf3tsoereborn-tu-${{ inputs.tag }}-${{ matrix.platform }}"
          fi
          python scripts/build.py --package "${out}"

      - name: Package (tu) (macOS)
        if: steps.tu.outputs.has_tu == 'true' && startsWith(matrix.platform, 'mac-')
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-tu-${{ matrix.platform }}"
            version="0.0.0"
          else
            out="sf3tsoereborn-tu-${{ inputs.tag }}-${{ matrix.platform }}"
            version="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          fi
          python scripts/package-mac.py --name "${out}" --version "${version}"

      - name: Upload CI artifact (tu)
        if: inputs.publish_mode == 'artifact' && steps.tu.outputs.has_tu == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}-tu-${{ matrix.platform }}
          path: pkg/
          if-no-files-found: error

      - name: Upload release artifact (tu)
        if: inputs.publish_mode == 'release' && steps.tu.outputs.has_tu == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-tu-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
